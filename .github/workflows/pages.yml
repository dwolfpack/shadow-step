name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages serves the gh-pages branch for this repository, so publishing the site
# is just mirroring main onto that branch. This needs no Pages admin rights,
# which the Actions token does not have here.
permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main onto gh-pages
        run: git push origin HEAD:gh-pages --force
